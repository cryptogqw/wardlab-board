"2026-10-30T13:56:49.514462Z","from":0.675,"to":0.725,"pp":5.0}},"mapping":{"status":"approved"},"eligibility":{"observe":{"ok":true,"reason":null},"probability":{"ok":true,"reason":null}},"rules":{"excerpt":"This market will resolve according to the party that wins control of the United States Senate in the 2026 United States midterm election.\n\nA party wins control of the United States Senate if it wins a majority of the chamber’s voting seats. If no party wins a majority of voting seats, the party that wins control of the chamber is the party that wins half of the voting seats and holds the Vice Presidency. If the outcome remains ambiguous after applying the above criteria, the chamber will be deemed controlled by the party with which the first selected President Pro Tempore of the Congress that convenes after the specified election is affiliated.\n\nThe following rules govern the counting of seats for determining which party wins control of the chamber.\n\nAll regular and special Senate elections that determine representation in the upcoming 120th Congress and are scheduled to take place in November 2026 as of October 31, 2026 are included. Runoffs for qualifying elections will determine attribution of the relevant seat, even if they take place after November 2026. Vacant seats for which no election or special election to fill the seat is scheduled to take place in November 2026 as of October 31, 2026 will be treated as held by the party affiliation of the most recent member to hold that seat.\n\nFor seats contested in the specified election, seats are attributed to the party under which the member was elected. If a member-elect changes party affiliation, or vacates their seat, between election day and the formal organization of Congress, the seat is attributed to the party under which the member was elected.\n\nFor seats not contested in the specified election, seats are attributed to the party that holds the seat as of the date of the election. If a current sitting member of the U.S. Senate who is not up for election changes party affiliation or vacates their seat after the date of the election, the seat is attributed to the party under which the member was affiliated at the time of the election.\n\nSenate members elected as independents who formally caucus with, or, for newly elected members, who announce their intent to caucus with, a party are included in that party’s count. If the caucus decisions of members of the Senate elected as independents cannot be determined on the date of the election, this market may remain open until the earlier of (i) an announcement from the relevant members of their intents to caucus, or (ii) January 4th, 11:59 PM ET of the following calendar year. If no such announcement is made by January 4th, 11:59 PM ET of the following calendar year, the member will not count towards the seat count of any party.\n\nThe resolution sources for this market will be official information from relevant state electoral authorities, the United States Congress, and a consensus of credible reporting.","resolution_source":"ルール本文で指定","observation":"2026-11-03 · event","close_time":"2026-11-04T04:59:00Z","fee_rate":"0","content_hash":"c4efec0eec729500","semantic_hash":"fc5b1e133840feab","versions":[{"version_id":"mv_929d9c7a2ada4d02","first_observed_at":"2026-10-25T22:45:50.799082Z","change":"初回観測","semantic_changed":true}]},"note":{"what":"11月3日の中間選挙後、どの党が米上院を支配するかを問う市場です。","settle":"議席の過半数を獲得した党が勝ちとなります。50対50の場合は副大統領の所属政党で判断し、それでも明確でない場合は上院仮議長の所属政党で判断します。","read":"米下院とあわせて見る必要があります。両院を同じ党が握るかどうかで、立法の難しさが決まります。"}},{"id":"balance_of_power_2026","theme":"us_politics","title":"米議会両院の支配権の組み合わせ","question":"米上下両院の支配権の4通りの組み合わせ（ほかに「その他」）","outcome":"民主党が両院を制する","outcome_full":"両院の支配権の組み合わせが「民主党が両院を制する」","kind":"election","kind_label":"選挙結果","structure":"basket","obs_type":"event","venue":"polymarket","market_ref":"0x16c63b7cc37f012b9f59ee164ec03877914c701d06d48291ae8d6fc08a088b0d","rethink_pp":10,"quote":{"bid":0.7, s and holds the Vice Presidency. If the outcome remains ambiguous after applying the above criteria, the chamber will be deemed controlled by the party with which the first selected President Pro Tempore of the Congress that convenes after the specified election is affiliated.\n\nA party wins control of the United States House of Representatives if it wins a majority of the chamber’s voting seats. If no party wins a majority of voting seats, the chamber will be deemed controlled by the party with which the first elected Speaker of the House of the Congress that convenes after the 2026 midterm election is affiliated.\n\nThe following rules govern the counting of seats for determining which party wins control of the chambers.\n\nFor determining Senate control, all regular and special Senate elections that determine representation in the upcoming 120th Congress and are scheduled to take place in November 2026 as of October 31, 2026 are included. Vacant Senate seats for which no election or special election to fill the seat is scheduled to take place in November 2026 as of October 31, 2026 will be treated as held by the party affiliation of the most recent member to hold that seat. For determining House control, all House elections in the 2026 United States midterm election that elect voting members and determine representation in the upcoming 120th Congress are included. Where a Senate or House seat is decided by a runoff, the runoff result will determine attribution of that seat, even if it takes place after November 2026.\n\nFor seats contested in the specified election, seats are attributed to the party under which the member was elected. If a member-elect changes party affiliation, or vacates their seat, between election day and the formal organization of Congress, the seat is attributed to the party under which the member was elected. \n\nFor seats not contested in the specified election, seats are attributed to the party that holds the seat as of the date of the election. If a current sitting member of the U.S. Senate who is not up for election changes party affiliation or vacates their seat after the date of the election, the seat is attributed to the party under which the member was affiliated at the time of the election.\n\nSenate and House members elected as independents who formally caucus with, or, for newly elected members, who announce their intent to caucus with, a party are included in that party’s count. If the caucus decisions of members of the Senate or House elected as independents cannot be determined on the date of the election, this market may remain open until the earlier of (i) an announcement from the relevant members of their intents to caucus, or (ii) January 4th, 11:59 PM ET of the following calendar year. If no such announcement is made by January 4th, 11:59 PM ET of the following calendar year, the member will not count towards the seat count of any party.\n\nThe resolution sources for this market will be official information from relevant state electoral authorities, the United States Congress, and a consensus of credible reporting.","resolution_source":"ルール本文で指定","observation":"2026-11-03 · event","close_time":"2026-11-04T04:59:00Z","fee_rate":"0","content_hash":"89184087c6fa4812","semantic_hash":"c97be879dedd20de","versions":[{"version_id":"mv_d14a9a2aa3d742b2","first_observed_at":"2026-10-25T22:45:50.799082Z","change":"初回観測","semantic_changed":true}]},"note":{"what":"両院の支配権の組み合わせを問う市場です。民主党が両院を制する、共和党が両院を制する、2通りのねじれ、そして「その他」に分かれます。","settle":"両院をそれぞれのルールで判定し、それを組み合わせて1つの結果にします。「その他」はまれなケースを受け止める区分です。","read":"片方の院だけを見るより、両院を同じ党が握るかどうかという情報が1つ多く得られます。ねじれは通常、立法が進みにくいことを意味します。"}},{"id":"crypto_market_structure_law_2026","theme":"us_politics","title":"暗号資産市場構造法案の年内成立","question":"2026年末までに暗号資産の市場構造に関する法案（CLARITY法案など）が署名されて連邦法になるか","outcome":"はい","outcome_full":"2026年末までに暗号資産市場構造法案が連邦法として成立","kind":"by_deadline","kind_label":"期限までに起きるか","structure":"single","obs_type":"event_by_deadline","venue":"pol     const outs = (ev && ev.outcomes) || [];
    if (outs.length < 3) return null;
    if (ev.kind === "range_end") {
      const b = [];
      for (const o of outs) {
        const r = parseRange(keyOf(o));
        if (!r) return null;
        b.push({ ...r, p: o.mid, label: o.label, bid: o.bid, ask: o.ask });
      }
      return normalize(b, "range");
    }
    if (ev.kind === "point_price") {
      const s = outs.map((o) => ({ k: nums(keyOf(o))[0], p: o.mid })).filter((x) => x.k != null && x.p != null).sort((a, b) => a.k - b.k);
      if (s.length < 2) return null;
      const b = [{ lo: -Infinity, hi: s[0].k, p: Math.max(0, 1 - s[0].p), label: T("低于 {k}", { k: fmt.num(s[0].k) }) }];
      let clipped = false;
      s.forEach((x, i) => {
        const nx = s[i + 1];
        let p = nx ? x.p - nx.p : x.p;
        if (p < 0) { clipped = true; p = 0; }
        b.push({ lo: x.k, hi: nx ? nx.k : Infinity, p, label: nx ? `${fmt.num(x.k)}–${fmt.num(nx.k)}` : T("高于 {k}", { k: fmt.num(x.k) }) });
      });
      const d = normalize(b, "ladder");
      d.clipped = clipped;
      return d;
    }
    return null;
  }

  /** 分位数：区间内线性插值；落在开口区间时返回边界并标明方向。 */
  function quantile(d, q) {
    let acc = 0;
    for (const x of d.buckets) {
      if (x.q > 0 && acc + x.q >= q) {
        if (!isFinite(x.lo)) return { v: x.hi, open: "below" };
        if (!isFinite(x.hi)) return { v: x.lo, open: "above" };
        return { v: x.lo + ((q - acc) / x.q) * (x.hi - x.lo) };
      }
      acc += x.q || 0;
    }
    const last = d.buckets[d.buckets.length - 1];
    return { v: isFinite(last.lo) ? last.lo : last.hi, open: "above" };
  }

  /** “高于 K”阶梯里概率跨过 50% 的价位（线性插值）。 */
  function survivalMedian(ev) {
    const s = ((ev && ev.outcomes) || []).map((o) => ({ k: nums(keyOf(o))[0], p: o.mid }))
      .filter((x) => x.k != null && x.p != null).sort((a, b) => a.k - b.k);
    for (let i = 0; i + 1 < s.length; i++) {
      if (s[i].p >= 0.5 && s[i + 1].p < 0.5) return s[i].k + ((s[i].p - 0.5) / (s[i].p - s[i + 1].p)) * (s[i + 1].k - s[i].k);
    }
    return null;
  }

  /** 触及阶梯：现价上方最近两档、下方最近一档。 */
  function touchLevels(ev, spot) {
    const outs = ((ev && ev.outcomes) || []).map((o) => ({ dir: /↓/.test(keyOf(o)) ? -1 : 1, k: nums(keyOf(o))[0], p: o.mid }))
      .filter((x) => x.k != null && x.p != null);
    return {
      up: outs.filter((x) => x.dir > 0 && (spot == null || x.k > spot)).sort((a, b) => a.k - b.k).slice(0, 2),
      down: outs.filter((x) => x.dir < 0 && (spot == null || x.k < spot)).sort((a, b) => b.k - a.k).slice(0, 1),
    };
  }

  // ---------------------------------------------------------------- 悬停读数（HTML 元素）
  /** data-tip='{"t":"标题","r":[["标签","值"],…]}' 的元素统一挂提示框。 */
  function bindTips(root) {
    root.querySelectorAll("[data-tip]").forEach((el) => {
      let d;
      try { d = JSON.parse(el.dataset.tip); } catch (e) { return; }
      const on = (e) => {
        const b = el.getBoundingClientRect();
        ui.tip.show(e && e.clientX != null ? e.clientX : b.left + b.width / 2, e && e.clientY != null ? e.clientY : b.top,
          d.t, (d.r || []).map(([label, value, muted]) => ({ label, value, muted: !!muted })));
      };
      el.addEventListener("pointermove", on);
      el.addEventListener("focus", () => on());
      el.addEventListener("pointerleave", () => ui.tip.hide());
      el.addEventListener("blur", () => ui.tip.hide());
    });
  }
  const tipAttr = (t, rows) => JSON.stringify({ t, r: rows });

  // ---------------------------------------------------------------- 央行会议定价条
  // 图例文字在渲染时翻译（语言在载入快照后才确定）
  const POLICY = [
    ["c2", "降息 50bp 以上"], ["c1", "降息 25bp"], ["h", "维持不变"], ["k1", "加息 25bp"], ["k2", "加息 50bp 以上"],
  ];
  function policyCat(label) {
    const s = String(label);
    if (/降息|cut|利下げ/i.test(s)) return /50|\+/.test(s) ? "c2" : "c1";
    if (/加息|hike|利上げ/i.test(s)) return /50|\+/.test(s) ? "k2" : "k1";
    if (/维持|不变|hold|unchanged|no change|据え置き|現状維持|変更なし/i.test(s)) return "h";
    return null;
  }

  function policyRows(snap) {
    return (snap.events || []).filter((e) => e.kind === "policy" && (e.outcomes || []).length >= 2).map((e) => {
      const parts = {};
      let sum = 0, missing = 0, top = null;
      const miss = new Set();
      for (const o of e.outcomes) {
        const k = policyCat(keyOf(o));
        if (!k) continue;
        if (o.mid == null) { missing++; miss.add(k); continue; }
        parts[k] = (parts[k] || 0) + o.mid;
        sum += o.mid;
        if (!top || o.mid > top.mid) top = o;
      }
      return { ev: e, parts, sum, missing, miss, top };
    }).filter((r) => r.sum > 0)
      .sort((a, b) => String(a.ev.next_event_at || "9").localeCompare(String(b.ev.next_event_at || "9")));
  }

  function policyLegend() {
    return html`<div class="chart-legend dv-legend">${POLICY.map(([k, l]) => html`<span><i class="sw pc-${k}"></i>${T(l)}</span>`)}</div>`;
  }

  function policyStack(snap, now) {
    const rows = policyRows(snap);
    if (!rows.length) return "";
    return html`<div class="pol">${rows.map((r) => {
      const e = r.ev;
      const segs = POLICY.map(([k, label]) => {
        const v = (r.parts[k] || 0) / r.sum;
        if (v < 0.004) return "";
        const tip = tipAttr(`${e.title} · ${T(label)}`, [[T("占比（按报价合计换算）"), fmt.pct(v)], ...(Math.abs(r.sum - 1) > 0.005 ? [[T("报价合计 {p}", { p: fmt.pct(r.sum) }), "", 1]] : [])]);
        return html`<i class="pc-${k}" style="flex:${v.toFixed(4)} 1 0" data-tip="${tip}" tabindex="0">${v >= 0.12 ? html`<span>${fmt.pct(v, 0)}</span>` : ""}</i>`;
      });
      const c = r.top && r.top.d24h_pp;
      const notes = [];
      if (r.missing) notes.push(T("{n} 档没有报价：条形只是已报价档位的相对占比，不是完整分布", { n: r.missing }));
      if (Math.abs(r.sum - 1) > 0.02) notes.push(T("报价合计 {p}，已按比例换算", { p: fmt.pct(r.sum) }));
      return html`<a class="pol-row" href="#event.${e.id}">
        <div class="pol-head"><b>${e.title}</b><span>${e.next_event_at ? `${e.next_event_kind === "close" ? T("交易截止") : T("公布")} ${fmt.date(e.next_event_at)} · ${fmt.countdown(e.next_event_at, now)}` : ""}</span></div>
        <div class="pol-bar ${r.missing ? "partial" : ""}" role="img" aria-label="${(r.missing ? T("已报价档位的相对占比，不是完整分布") : T("占比（按报价合计换算）")) + T("：") + POLICY.filter(([k]) => k in r.parts || r.miss.has(k))
          .map(([k, l]) => T(l) + " " + (k in r.parts ? fmt.pct(r.parts[k] / r.sum) : T("无报价"))).join(T("，"))}">${segs}</div>
        <div class="pol-foot"><span>${r.missing ? T("已报价中最高：") : T("最可能：")}<b>${r.top.label}</b> ${fmt.pct(r.top.mid)}${c != null ? html` · ${T("24 小时")} ${ui.delta(c, { rethink: e.rethink_pp })}` : ""}</span>${notes.length ? html`<span class="muted">${notes.join(T("；"))}</span>` : ""}</div>
      </a>`;
    })}</div>`;
  }

  // ---------------------------------------------------------------- 年末利率分布（横条）
  function rateBars(ev) {
    const outs = ((ev && ev.outcomes) || []).filter((o) => o.mid != null);
    const nq = ((ev && ev.outcomes) || []).filter((o) => o.mid == null);
    if (outs.length < 3) return "";
    // 数值与变化同一口径：都用各档原始中间价，不按合计换算（换算后的占比配原始报价的变化会误导）
    const sum = outs.reduce((a, o) => a + o.mid, 0);
    const main = outs.filter((o) => o.mid >= 0.01).sort((a, b) => nums(keyOf(b))[0] - nums(keyOf(a))[0]);
    const rest = outs.filter((o) => o.mid < 0.01);
    const restSum = rest.reduce((a, o) => a + o.mid, 0);
    const max = Math.max(...main.map((o) => o.mid));
    const row = (label, v, d, top, tip) => html`<div class="hbar ${top ? "tracked" : ""}" data-tip="${tip}" tabindex="0">
      <span class="lbl">${label}</span><span class="track"><span class="fill" style="width:${((v / max) * 100).toFixed(1)}%"></span></span>
      <span class="v"><b>${fmt.pct(v)}</b>${d != null ? ui.delta(d, { short: true }) : ""}</span></div>`;
    return html`<div class="hbars">${main.map((o) => row(o.label, o.mid, o.d24h_pp, o.mid === max,
      tipAttr(o.label, [[T("中间价"), fmt.pct(o.mid)], [T("买价 / 卖价"), `${fmt.pct(o.bid)} / ${fmt.pct(o.ask)}`]])))}
      ${rest.length ? row(T("其余 {n} 档", { n: rest.length }), restSum, null, false, tipAttr(T("其余各档中间价合计"), [[T("中间价合计"), fmt.pct(restSum)], [rest.map((o) => o.label).join(T("、")), "", 1]])) : ""}
      <p class="tiny muted hbar-note">${T("各档原始中间价，24 小时变化同口径；已报价各档合计 {p}", { p: fmt.pct(sum) })}${nq.length ? T("；{n} 档没有报价：{list}", { n: nq.length, list: nq.map((o) => o.label).join(T("、")) }) : ""}${T("。")}</p></div>`;
  }

  // ---------------------------------------------------------------- 走势 + 市场定价分布
  /**
   * 左边：过去 90 天日线；右边：同一纵轴上的期末价格分布（按报价合计归一化）。
   * opts: height, fmtY, distLabel, label。返回 {tails, median, iqr} 供图下说明。
   */
  function priceDist(el, series, dist, opts = {}) {
    const pts = (series || []).filter((r) => r[1] != null).map((r) => ({ t: r[0], v: r[1] }));
    if (pts.length < 2) { el.innerHTML = String(ui.empty(T("暂无价格序列"), T("采集运行后自动出现"))); return null; }
    const vals = pts.map((p) => p.v);
    let med = null, q25 = null, q75 = null;
    if (dist) {
      // 缺档时只是已报价区间的相对占比，不是完整分布：不给中位数与分位数
      if (!dist.missing) { med = quantile(dist, 0.5); q25 = quantile(dist, 0.25); q75 = quantile(dist, 0.75); }
      vals.push(quantile(dist, 0.05).v, quantile(dist, 0.95).v);
    }
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.06 || Math.abs(hi) * 0.01;
    lo -= pad; hi += pad;
    const step = WL.charts.niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const tails = { above: 0, below: 0 };
    if (dist) for (const b of dist.buckets) {
      if (b.lo >= hi) tails.above += b.q || 0;
      else if (b.hi <= lo) tails.below += b.q || 0;
    }
    const fy = opts.fmtY || ((v) => fmt.num(v));
    const spot = pts[pts.length - 1];

    const draw = () => {
      const W = Math.max(el.clientWidth, 280);
      const H = opts.height || 248;
      const m = { l: W < 420 ? 44 : 52, r: 6, t: 24, b: 24 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const distW = dist ? Math.max(92, Math.round(iw * 0.34)) : 0;
      const gap = dist ? 16 : 0;
      const lw = iw - distW - gap;
      const dx0 = m.l + lw + gap;
      const t0 = pts[0].t, t1 = spot.t;
      const x = (t) => m.l + (t1 === t0 ? lw : ((t - t0) / (t1 - t0)) * lw);
      const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ih;

      let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui.esc(opts.label || "")}">`;
      s += `<g class="grid">`;
      for (let v = lo; v <= hi + step / 1000; v += step) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
      s += `</g><g class="axis">`;
      for (let v = lo; v <= hi + step / 1000; v += step) s += `<text x="${m.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${ui.esc(fy(v))}</text>`;
      const nT = W < 420 ? 2 : 3;
      for (let i = 0; i <= nT; i++) {
        const t = t0 + ((t1 - t0) * i) / nT;
        s += `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nT ? "end" : "middle"}">${ui.esc(fmt.date(t))}</text>`;
      }
      s += `</g>`;
      s += `<g class="pane-label"><text x="${m.l}" y="12">${ui.esc(T("过去 90 天（日线）"))}</text>`;
      if (dist) s += `<text x="${dx0}" y="12">${ui.esc(opts.distLabel || T("期末定价"))}</text>`;
      s += `</g>`;
      if (dist) s += `<line class="divider" x1="${(m.l + lw + gap / 2).toFixed(1)}" x2="${(m.l + lw + gap / 2).toFixed(1)}" y1="${m.t}" y2="${m.t + ih}"/>`;

      // 分布条
      let bars = "", hits = "", labels = "";
      if (dist) {
        const inDomain = dist.buckets.filter((b) => b.hi > lo && b.lo < hi);
        const pmax = Math.max(...inDomain.map((b) => b.q || 0), 0.0001);
        const mode = inDomain.reduce((a, b) => ((b.q || 0) > (a.q || 0) ? b : a), inDomain[0]);
        const room = distW - 40;
        inDomain.forEach((b) => {
          const i = dist.buckets.indexOf(b);
          const y1 = y(Math.min(b.hi, hi)), y2 = y(Math.max(b.lo, lo));
          const h = Math.max(1, y2 - y1 - 2);
          if (b.q == null) {
            if (h >= 11) labels += `<text class="dl miss" x="${dx0}" y="${((y1 + y2) / 2 + 4).toFixed(1)}">${T("无报价")}</text>`;
            hits += `<rect class="hit" data-i="${i}" x="${dx0}" y="${y1.toFixed(1)}" width="${distW}" height="${Math.max(2, y2 - y1).toFixed(1)}" tabindex="0"/>`;
            return;
          }
          const w = Math.max(b.q > 0 ? 2 : 0, (b.q / pmax) * room);
          bars += `<rect class="db${b === mode ? " mode" : ""}" x="${dx0}" y="${(y1 + 1).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, h / 2).toFixed(1)}"/>`;
          if (b === mode || (b.q >= 0.1 && h >= 11)) labels += `<text class="dl" x="${(dx0 + w + 4).toFixed(1)}" y="${((y1 + y2) / 2 + 4).toFixed(1)}">${fmt.pct(b.q, 0)}</text>`;
          hits += `<rect class="hit" data-i="${i}" x="${dx0}" y="${y1.toFixed(1)}" width="${distW}" height="${Math.max(2, y2 - y1).toFixed(1)}" tabindex="0"/>`;
        });
        if (med && !med.open && med.v > lo && med.v < hi) s += `<line class="median" x1="${dx0}" x2="${W - m.r}" y1="${y(med.v).toFixed(1)}" y2="${y(med.v).toFixed(1)}"/>`;
      }
      // 现价水平虚线延伸到分布区，便于比较“市场定价在现价上方还是下方”
      s += `<line class="spot-guide" x1="${x(spot.t).toFixed(1)}" x2="${W - m.r}" y1="${y(spot.v).toFixed(1)}" y2="${y(spot.v).toFixed(1)}"/>`;
      s += bars + labels;
      let d = "";
      pts.forEach((p, i) => { d += (i ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.v).toFixed(1); });
      s += `<path class="line" d="${d}"/>`;
      s += `<circle class="end" cx="${x(spot.t).toFixed(1)}" cy="${y(spot.v).toFixed(1)}" r="4.5"/>`;
      s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><circle class="hover-dot" r="4.5" visibility="hidden"/>`;
      s += `<rect class="overlay" x="${m.l}" y="${m.t}" width="${lw}" height="${ih}" tabindex="0" aria-label="${ui.esc(T("用左右方向键逐日读数"))}"/>`;
      s += `<g class="hits">${hits}</g></svg>`;
      el.innerHTML = s;

      const svg = el.querySelector("svg");
      const ov = svg.querySelector(".overlay"), xh = svg.querySelector(".xhair"), dot = svg.querySelector(".hover-dot");
      let idx = pts.length - 1;
      const show = (i, cx, cy) => {
        idx = Math.max(0, Math.min(pts.length - 1, i));
        const p = pts[idx], px = x(p.t), py = y(p.v);
        xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
        dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
        const r = svg.getBoundingClientRect();
        ui.tip.show(cx ?? r.left + px, cy ?? r.top + py, fmt.isoDay(p.t), [{ label: opts.valueLabel || T("收盘"), value: fy(p.v) }]);
      };
      const hide = () => { xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); ui.tip.hide(); };
      const nearest = (clientX) => {
        const r = svg.getBoundingClientRect();
        const t = t0 + ((clientX - r.left - m.l) / lw) * (t1 - t0);
        let best = 0;
        pts.forEach((p, i) => { if (Math.abs(p.t - t) < Math.abs(pts[best].t - t)) best = i; });
        return best;
      };
      ov.addEventListener("pointermove", (e) => show(nearest(e.clientX), e.clientX, e.clientY));
      ov.addEventListener("pointerdown", (e) => show(nearest(e.clientX), e.clientX, e.clientY));
      ov.addEventListener("pointerleave", hide);
      ov.addEventListener("blur", hide);
      ov.addEventListener("focus", () => show(idx));
      ov.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { show(idx - 1); e.preventDefault(); }
        else if (e.key === "ArrowRight") { show(idx + 1); e.preventDefault(); }
        else if (e.key === "Escape") hide();
      });
      svg.querySelectorAll(".hit").forEach((r) => {
        const b = dist.buckets[+r.dataset.i];
        const on = (e) => {
          const bb = r.getBoundingClientRect();
          ui.tip.show(e && e.clientX != null ? e.clientX : bb.left + 20, e && e.clientY != null ? e.clientY : bb.top,
            (opts.distLabel || T("期末定价")) + " · " + b.label, [
              { label: T("占比（按报价合计换算）"), value: b.q == null ? T("无报价") : fmt.pct(b.q) },
              ...(b.bid != null || b.ask != null ? [{ label: T("买价 / 卖价"), value: `${fmt.pct(b.bid)} / ${fmt.pct(b.ask)}`, muted: true }] : []),
            ]);
        };
        r.addEventListener("pointermove", on);
        r.addEventListener("pointerdown", on);
        r.addEventListener("focus", () => on());
        r.addEventListener("pointerleave", () => ui.tip.hide());
        r.addEventListener("blur", () => ui.tip.hide());
      });
    };
    WL.charts.observe(el, draw);
    return { tails, median: med, q25, q75, spot: spot.v, lo, hi };
  }

  // ---------------------------------------------------------------- 事件总表的行内条
  /** 概率条：中间价填充，买卖价区间用浅色带。 */
  function probBar(q) {
    if (!q || (q.mid == null && q.bid == null)) return html`<span class="pb"><span class="pb-track"></span></span>`;
    const c = (v) => Math.max(0, Math.min(100, v * 100)).toFixed(1);
    return html`<span class="pb"><span class="pb-track">${q.bid != null && q.ask != null ? html`<i class="pb-band" style="left:${c(q.bid)}%;width:${(c(q.ask) - c(q.bid)).toFixed(1)}%"></i>` : ""}${q.mid != null ? html`<i class="pb-mid" style="left:${c(q.mid)}%"></i>` : ""}</span></span>`;
  }

  /** 变化条：以 0 为中线，±阈值占满半边；超过阈值时加粗描边。 */
  function changeBar(v, threshold) {
    if (v == null) return html`<span class="cb"><span class="cb-track"><i class="cb-zero"></i></span></span>`;
    const th = threshold || 10;
    const w = Math.min(50, (Math.abs(v) / th) * 50);
    const over = Math.abs(v) >= th;
    return html`<span class="cb"><span class="cb-track"><i class="cb-zero"></i><i class="cb-fill ${v >= 0 ? "up" : "down"} ${over ? "over" : ""}" style="${v >= 0 ? "left:50%" : `left:${(50 - w).toFixed(1)}%`};width:${Math.max(w, v === 0 ? 0 : 1.5).toFixed(1)}%"></i></span></span>`;
  }

  WL.dash = { keyOf, nums, parseRange, policyCat, distOf, quantile, survivalMedian, touchLevels, bindTips, tipAttr, policyRows, policyLegend, policyStack, rateBars, priceDist, probBar, changeBar };
})(window.WL = window.WL || {});

/* api.js */
/* 数据访问：优先本地服务 /api；静态预览时读内嵌或 data/demo.json。
   静态模式下的反馈与审核只保存在本机浏览器，并明确告知。 */
(function (WL) {
  "use strict";
  const LS_FB = "wardlab.feedback.v1";
  const LS_RV = "wardlab.review.v1";

  function lsGet(k) {
    try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }

  const api = {
    source: null,      // api | inline | static
    snapshot: null,

    /** 静态预览可内嵌两份快照（演示 / 实时副本），按本机偏好选择。 */
    inlineChoices() {
      const out = {};
      for (const k of ["demo", "live", "public"]) {
        const el = document.getElementById("wl-data-" + k);
        if (el) out[k] = el;
      }
      const legacy = document.getElementById("wl-data");
      if (legacy && !out.demo) out.demo = legacy;
      return out;
    },
    preferredInline() {
      let pref = null;
      try { pref = localStorage.getItem("wardlab.preview.source"); } catch (e) { /* 无本机存储 */ }
      const ch = this.inlineChoices();
      return ch[pref] ? pref : ch.demo ? "demo" : Object.keys(ch)[0];
    },
    setInline(k) {
      try { localStorage.setItem("wardlab.preview.source", k); } catch (e) { /* 无本机存储时只在本次生效 */ }
      this.inlinePick = k;
    },

    async load() {
      const choices = this.inlineChoices();
      let snap = null;
      if (Object.keys(choices).length) {
        const k = this.inlinePick || this.preferredInline();
        this.inlinePick = k;
        snap = JSON.parse(choices[k].textContent);
        this.source = "inline";
      } else {
        try {
          const r = await fetch("api/snapshot", { cache: "no-store", headers: { Accept: "application/json" } });
          if (!r.ok) throw new Error(String(r.status));
          snap = await r.json();
          this.source = "api";
        } catch (e) {
          const r = await fetch("data/demo.json", { cache: "no-store" });
          snap = await r.json();
          this.source = "static";
        }
      }
      if (this.source !== "api") this.overlayLocal(snap);
      this.snapshot = snap;
      return snap;
    },

    get writable() { return this.source === "api"; },

    overlayLocal(snap) {
      const fb = lsGet(LS_FB);
      for (const s of snap.signals || []) if (fb[s.id]) s.feedback = fb[s.id];
      const rv = lsGet(LS_RV);
      for (const m of (snap.review && snap.review.mappings) || []) if (rv[m.id]) m.decision = rv[m.id];
      for (const m of (snap.review && snap.review.relations) || []) if (rv[m.id]) m.decision = rv[m.id];
    },

    async feedback(signalId, category) {
      const given = { category, given_at: new Date().toISOString() };
      if (this.writable) {
        const r = await fetch("api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ signal_id: signalId, category }),
        });
        if (!r.ok) throw new Error("服务未接受反馈（HTTP " + r.status + "）");
      } else {
        const fb = lsGet(LS_FB);
        fb[signalId] = given;
        lsSet(LS_FB, fb);
      }
      const s = (this.snapshot.signals || []).find((x) => x.id === signalId);
      if (s) s.feedback = given;
      return given;
    },

    async decide(items) {
      // items: [{id, decision: approve|reject}]
      const at = new Date().toISOString();
      if (this.writable) {
        const r = await fetch("api/review/decisions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items }),
        });
        if (!r.ok) throw new Error("服务未接受审核结果（HTTP " + r.status + "）");
      } else {
        const rv = lsGet(LS_RV);
        for (const it of items) rv[it.id] = { decision: it.decision, at };
        lsSet(LS_RV, rv);
      }
      const all = [...(this.snapshot.review.mappings || []), ...(this.snapshot.review.relations || [])];
      for (const it of items) {
        const m = all.find((x) => x.id === it.id);
        if (m) m.decision = { decision: it.decision, at };
      }
    },

    async send(method, path, body) {
      if (!this.writable) throw new Error("静态预览不能保存；请在本机服务里操作。");
      const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((j.detail && (j.detail[0] ? j.detail[0].msg : j.detail)) || "HTTP " + r.status);
      return j;
    },

    async refresh() {
      const r = await fetch("api/snapshot", { cache: "no-store" });
      this.snapshot = await r.json();
      return this.snapshot;
    },

    async undoDecision(id) {
      if (this.writable) {
        const r = await fetch("api/review/decisions/" + encodeURIComponent(id), { method: "DELETE" });
        if (!r.ok) throw new Error("服务未接受撤回（HTTP " + r.status + "）");
      } else {
        const rv = lsGet(LS_RV);
        delete rv[id];
        lsSet(LS_RV, rv);
      }
      for (const m of [...(this.snapshot.review.mappings || []), ...(this.snapshot.review.relations || [])]) {
        if (m.id === id) delete m.decision;
      }
    },
  };

  WL.api = api;
})(window.WL = window.WL || {});

window.WL.views = window.WL.views || {};
/* 跨页面复用的组件：决策卡摘要、事件行。 */
(function (WL) {
  "use strict";
  const { html, raw, icon, kind, themeTag, delta, pstrip, mappingPill, pill, prevMid } = WL.ui;
  const fmt = WL.fmt;
  const T = WL.T;

  /** 多档事件里有几档有报价；单档、齐全或已结算时返回 null（不必提示）。 */
  function quotedOf(ev) {
    const outs = ev.outcomes || [];
    if (outs.length < 2 || (ev.usage && ev.usage.level === "settled")) return null;
    const q = outs.filter((o) => o.mid != null).length;
    return q < outs.length ? { q, n: outs.length } : null;
  }

  function isSettled(ev) {
    return !!(ev.settlement && ev.settlement.stage === "final");
  }

  /** 已结算事件的主值：写结果，不写残留买价。 */
  function resultText(ev) {
    const so = ev.settlement && ev.settlement.outcome;
    return T("结果：{r}", { r: so === "YES" ? ev.outcome : so === "NO" ? ev.outcome + T("：") + T("否") : T("见结算记录") });
  }

  /** 下一次官方公布 / 交易截止：官方不预告具体时刻时只写日期，按东京日期倒数。 */
  function nextWhen(ev, now) {
    if (!ev.next_event_at || isSettled(ev)) return "";
    const what = ev.next_event_kind === "close" ? T("交易截止") : T("官方公布");
    return ev.next_event_time_known === false
      ? T("{what} {d}（具体时刻未公布）· {c}", { what, d: fmt.date(ev.next_event_at), c: fmt.dayCountdown(ev.next_event_at, now) })
      : `${what} ${fmt.date(ev.next_event_at)} · ${fmt.countdown(ev.next_event_at, now)}`;
  }

  function eventById(snap, id) {
    return (snap.events || []).find((e) => e.id === id);
  }

  function signalCard(snap, s, now) {
    const ev = eventById(snap, s.event_id);
    const c = s.change || {};
    let body = "";
    if (s.kind === "conditional_arb" && s.opportunity) {
      body = html`<div class="quote-line"><div class="small ink2">现金利润下界 · 有利容量 · 资金占用</div>
        <div class="val"><b>${fmt.usd(s.opportunity.net_usd)}</b><div class="tiny muted">${fmt.usd(s.opportunity.capacity_usd, 0)} · ${s.opportunity.days_locked ?? "—"} 天</div></div></div>`;
    } else if (c.to != null && ev) {
      // 卡片上的概率尺用提醒生成时的同一份报价，不混用现在的买卖价
      const at = s.at_signal || (c.spread_pp != null ? { bid: c.to - c.spread_pp / 200, ask: c.to + c.spread_pp / 200, mid: c.to } : { mid: c.to });
      body = html`<div class="quote-line"><div>${pstrip(at, c.from)}<div class="tiny muted" style="margin-top:2px">提醒生成时 ${fmt.time(at.time || c.data_time)}${s.now && s.now.note ? " · 现在" + s.now.note : ""}</div></div>
        <div class="val"><b>${WL.ui.nf(fmt.pct(c.to))}</b><div>${delta(c.delta_pp, { rethink: ev.rethink_pp })}</div></div></div>`;
    } else if (c.rule_changed) {
      body = html`<div class="row">${pill("规则变更", "warn", "alert")}${ev ? mappingPill(ev.mapping.status) : ""}</div>`;
    }
    const fb = s.feedback ? WL.ui.FEEDBACK.find((f) => f[0] === s.feedback.category) : null;
    const links = (s.link && s.link.links) || [];
    return html`<a class="signal-card" href="#card.${s.id}">
      <div class="meta-row">${kind(s.kind)}<span class="row" style="gap:6px">${s.tier === "watch" ? pill("观察区", "") : ""}${ev ? themeTag(snap, ev.theme, true) : ""}</span></div>
      <h3>${s.title}</h3>
      ${body}
      ${links.length ? html`<div class="relate"><b>与我有关</b><span>${links.map((l) => l.name).join("、")}：${links[0].mechanism}${links[0].status === "recorded" ? "（系统记载，未经你确认）" : ""}</span></div>` : ""}
      <div class="next"><b>${s.next.handling ? s.next.action : s.next.action}</b><span>${s.next.trigger}</span></div>
      <div class="meta-row"><span>${s.confidence ? "参考强度 " + s.confidence + " · " : ""}${fmt.rel(s.created_at, now)}生成${s.merged ? " · 已合并 " + s.merged + " 张同类旧卡" : ""}</span><span>${fb ? "已反馈：" + fb[1] : "待反馈"}</span></div>
    </a>`;
  }

  function eventRow(snap, ev, now) {
    const q = ev.quote || {};
    const prev = prevMid(ev);
    const c = ev.change || {};
    const chips = [];
    const done = isSettled(ev);
    if (ev.usage && !done) chips.push(WL.ui.usagePill(ev.usage));     // 已结算：下面的结算标签已写明结果
    // 多档事件的判定只看主档：整组有缺档时直接写出来，不只放在悬停说明里
    const qn = quotedOf(ev);
    if (qn) chips.push(pill(T("整组 {q}/{n} 档有报价", qn), "ghost"));
    // 参考强度的取值随界面语言翻译（低 / low）；已结算的不再给参考强度（它说的是报价，不是结果）
    if (!done) chips.push(pill(T("参考强度 {v}", { v: ev.reading ? ev.reading.confidence : ev.quality.label }), (ev.reading && /^(低|low)$/i.test(ev.reading.confidence || "")) ? "warn" : ""));
    if (ev.kind_label) chips.push(pill(ev.kind_label, "ghost"));
    if (ev.mapping.status !== "approved") chips.push(WL.ui.approvalTag(ev));
    // 结算标签写明是哪一档、结果是“是”还是“否”，不只写 YES
    const so = ev.settlement && ev.settlement.outcome;
    if (ev.settlement) chips.push(pill(ev.settlement.label + (so ? T("：") + ev.outcome + " " + ({ YES: T("是"), NO: T("否") }[so] || so) : ""), ev.settlement.stage === "final" ? "info" : "warn"));
    if (ev.venue === "kalshi") chips.push(pill("Kalshi", "ghost"));
    const nw = nextWhen(ev, now);
    const when = nw ? html`<span class="tiny muted">${nw}</span>` : "";
    return html`<a class="ev-row" href="#event.${ev.id}">
      <div class="ev-title"><b>${ev.title}</b>
        ${ev.outcome_full ? html`<em class="ev-def">${T("数字代表：{v}", { v: ev.outcome_full })}</em>` : ""}
        <span>${ev.reading ? ev.reading.headline : ev.outcome + " · " + ev.decision}</span></div>
      <div class="ev-strip">${done ? "" : pstrip(q, prev)}</div>
      <div class="ev-val">${done ? html`<span class="ev-result">${resultText(ev)}</span>` : q.mid != null ? html`<b>${WL.ui.nf(fmt.pctBare(q.mid))}<small class="muted" style="font-size:.55em;font-weight:500">%</small></b>${delta(c.d24h_pp, { rethink: ev.rethink_pp, approx: c.d24h_anchor === "backfill" })}` : html`<span class="na">${q.bid != null ? T("买 {p}", { p: fmt.pct(q.bid, 0) }) : "—"}</span>${delta(c.d24h_pp, { rethink: ev.rethink_pp, approx: c.d24h_anchor === "backfill" })}`}</div>
      <div class="ev-d24">${delta(c.d24h_pp, { rethink: ev.rethink_pp, reason: done ? null : c.d24h_reason, short: true, approx: c.d24h_anchor === "backfill" })}</div>
      <div class="ev-d7">${delta(c.d7d_pp, { reason: done ? null : c.d7d_reason, short: true, approx: c.d7d_anchor === "backfill" })}</div>
      <div class="ev-spark">${WL.charts.spark(ev.series["7d"])}</div>
      <div class="ev-meta">${chips}${when}</div>
    </a>`;
  }

  /** 机会组合是否通过：资格通过且现金利润下界为正。 */
  function oppPassed(o) {
    const st = o.statuses || {};
    return st.eligibility === "eligible" && o.cash_profit_lb != null && o.cash_profit_lb > 0;
  }

  // ---------------------------------------------------------------- 事件时间线（timeline.py）
  // 事件页、今日页共用同一份结构化结果和同一套说法；标记只说明同期发生了什么，不说价格为什么变
  const TL_LEVEL = { high: "高", medium: "中", low: "低" };
  const TL_STAGE = { proposed: "平台提交结算提案", disputed: "结算有争议", final: "平台最终结算", redeemable: "可兑付" };

  /** 时间线一项的时间：具体时刻未公布的日程只写日期。 */
  function markWhen(m) {
    return m.kind === "schedule" && m.time_known === false ? T("{d}（具体时刻未公布）", { d: fmt.date(m.at) }) : T("{t} 东京", { t: fmt.time(m.at) });
  }

  /** 走势图上的短标签。 */
  function markShort(m) {
    if (m.kind === "schedule") return (m.key || "").startsWith("close_") ? T("截止") : T("日程");
    if (m.kind === "rules") return m.semantic ? T("规则变更") : T("格式调整");
    if (m.kind === "quality") return T("质量 {a}→{b}", { a: T(TL_LEVEL[m.from] || m.from), b: T(TL_LEVEL[m.to] || m.to) });
    if (m.kind === "settlement") return m.stage === "final" ? T("结算") : T("结算提案");
    return fmt.pp(m.pp) + " pp";
  }

  /** 时间线列表里的一句话。 */
  function markText(m, ev) {
    if (m.kind === "schedule") return (m.key || "").startsWith("close_") ? T("平台交易截止") : m.title || T("官方日程");
    if (m.kind === "rules") return m.semantic ? T("规则出现新版本，语义有变化") : T("规则文本格式或状态变化，语义未变");
    if (m.kind === "quality") return T("数据质量 {a} → {b}", { a: T(TL_LEVEL[m.from] || m.from), b: T(TL_LEVEL[m.to] || m.to) });
    if (m.kind === "settlement") {
      const o = m.outcome === "YES" ? T("是") : m.outcome === "NO" ? T("否") : m.outcome;
      return T(TL_STAGE[m.stage] || m.stage) + (o ? T("：「{o}」为“{r}”", { o: ev.outcome, r: o }) : "");
    }
    return shiftText(m);
  }

  /** 变化点：从哪个水平到哪个水平，以及发生在哪两个小时桶之间。 */
  function shiftText(m) {
    return T("变化点：{a} → {b}（{d}），在 {t1}–{t2} 之间，下一小时仍在新水平", {
      a: fmt.pct(m.from), b: fmt.pct(m.to), d: fmt.pp(m.pp) + " pp", t1: fmt.time(m.after), t2: fmt.time(m.at) });
  }

  WL.comp = { eventById, signalCard, eventRow, oppPassed, quotedOf, isSettled, resultText, nextWhen, markWhen, markShort, markText, shiftText };
})(window.WL = window.WL || {});

/* views/today.js */
/* 首页：一屏看全。结论与关键数字 → 值得研究的变化与日程 → 市场背景 → 央行会议、BTC、美元/日元的市场定价图 → 全部事件总表 → 缺口与待办。 */
(function (WL) {
  "use strict";
  const { html, raw, icon, themeOf, delta, note, pill } = WL.ui;
  const fmt = WL.fmt;
  const T = WL.T;
  const D = () => WL.dash;

  const REL = { high: 0, medium: 1, low: 2 };
  // 下面两组文字在渲染时经 T() 翻译（语言在载入快照后才确定）
  const USAGE_SHORT = { observe: "可观察", verify: "弱证据", no_judgment: "暂不用", settled: "已结算" };
  const SORTS = [["relevance", "相关度"], ["move", "24 小时变化"], ["prob", "概率"]];
  const MOBILE_ROWS = 8;

  function absD(e) {
    const v = e.change && e.change.d24h_pp;
    return v == null ? -1 : Math.abs(v);
  }

  function chgText(v, unit) {
    if (v == null) return "—";
    return fmt.sign(v) + Math.abs(v).toFixed(unit === "bp" ? 0 : 2) + (unit === "bp" ? " bp" : "%");
  }

  function marketTile(m) {
    const val = m.kind === "yield" ? m.value.toFixed(2) + "%" : fmt.num(m.value, m.nd);
    return html`<div class="mk" title="${m.source} · ${T("数据时间 {t} 东京", { t: fmt.time(m.as_of) })}">
      <div class="mk-head"><span>${m.label}</span><span>${fmt.date(m.as_of)}</span></div>
      <div class="mk-val">${WL.ui.nf(val)}${m.unit && m.kind !== "yield" ? html`<small>${m.unit}</small>` : ""}</div>
      <div class="mk-chg"><span>${T("1 日")} <b>${chgText(m.chg_1d, m.chg_unit)}</b></span><span>${T("30 日")} <b>${chgText(m.chg_30d, m.chg_unit)}</b></span></div>
      <div class="mk-spark">${WL.charts.spark(m.series, 140, 28)}</div>
    </div>`;
  }

  function usageDot(u) {
    if (!u) return "";
    return html`<span class="ud ${u.level}" title="${u.why || ""}"><i></i>${USAGE_SHORT[u.level] ? T(USAGE_SHORT[u.level]) : u.label}</span>`;
  }

  // 事件格里的标记：未批准（各宽度都显示）；手机上隐藏了“能否参考”列，这里补一个
  function flags(e) {
    const tag = WL.ui.approvalTag(e);
    return html`<em class="ev-flags">${tag}${usageDot(e.usage)}${quoted(e)}</em>`;
  }

  // 多档事件缺档时写出“q/n 档有报价”，与事件卡上的标签一致
  function quoted(e) {
    const qn = WL.comp.quotedOf(e);
    return qn ? html`<span class="ud-q">${T("{q}/{n} 档有报价", qn)}</span>` : "";
  }

  function eventTable(snap, st) {
    const evs = (snap.events || []).slice();
    const by = {
      relevance: (a, b) => (REL[a.relevance] ?? 1) - (REL[b.relevance] ?? 1) || absD(b) - absD(a),
      move: (a, b) => absD(b) - absD(a),
      prob: (a, b) => ((b.quote || {}).mid ?? -1) - ((a.quote || {}).mid ?? -1),
    }[st.sort];
    evs.sort(by);
    // 手机上先只显示一部分：按主题分组时每组前 3 个，其余排序时前 8 个
    const row = (e, i, more) => {
      const q = e.quote || {};
      const c = e.change || {};
      return html`<tr data-href="#event.${e.id}" class="${more ? "more" : ""}">
        <td class="c-ev"><a href="#event.${e.id}"><b>${e.title}</b><span>${e.outcome_full || e.outcome}</span>${flags(e)}</a></td>
        <td class="c-p">${WL.comp.isSettled(e) ? html`<b class="small">${WL.comp.resultText(e)}</b>` : html`${D().probBar(q)}<b>${q.mid != null ? WL.ui.nf(fmt.pct(q.mid)) : q.bid != null ? T("买 {p}", { p: fmt.pct(q.bid, 0) }) : "—"}</b>`}</td>
        <td class="c-d">${D().changeBar(c.d24h_pp, e.rethink_pp)}${delta(c.d24h_pp, { rethink: e.rethink_pp, short: true, approx: c.d24h_anchor === "backfill", reason: WL.comp.isSettled(e) ? null : c.d24h_reason })}</td>
        <td class="c-d7">${delta(c.d7d_pp, { short: true, approx: c.d7d_anchor === "backfill", reason: WL.comp.isSettled(e) ? null : c.d7d_reason })}</td>
        <td class="c-sp">${WL.charts.spark(e.series && e.series["7d"], 96, 26)}</td>
        <td class="c-u">${usageDot(e.usage)}${quoted(e)}</td>
      </tr>`;
    };
    let body;
    if (st.sort === "relevance") {
      body = (snap.themes || []).map((t) => {
        const g = evs.filter((e) => e.theme === t.id);
        if (!g.length) return "";
        return html`<tr class="grp"><th colspan="6"><span class="row" style="gap:8px"><i class="theme-dot s${t.slot}"></i>${t.name}<span class="muted">${T("{n} 个", { n: g.length })}</span></span></th></tr>${g.map((e, i) => row(e, i, i >= 3))}`;
      });
    } else body = evs.map((e, i) => row(e, i, i >= MOBILE_ROWS));
    return html`<table class="evt ${st.all ? "all" : ""}">
      <thead><tr><th class="c-ev">${T("事件 · 数字代表")}</th><th class="c-p">${T("市场概率")}</th><th class="c-d">${T("24 小时")}</th><th class="c-d7">${T("7 日")}</th><th class="c-sp">${T("7 日走势")}</th><th class="c-u">${T("能否参考")}</th></tr></thead>
      <tbody>${body}</tbody></table>
      ${evs.length > MOBILE_ROWS ? html`<button class="btn sm quiet evt-more" data-action="all">${st.all ? T("收起") : T("展开全部 {n} 个", { n: evs.length })}</button>` : ""}`;
  }

  /** BTC、美元/日元：找“期末分布”事件、其他阶梯的中位数和触及概率。 */
  function priceCard(snap, under, title, opts) {
    const evs = (snap.events || []).filter((e) => e.underlying === under);
    const mk = (snap.markets || []).find((m) => m.symbol === under);
    const series = mk ? mk.series : under === "JPY=X" && snap.fx ? snap.fx.usdjpy.series : null;
    if (!series || series.length < 2) return null;
    const cands = evs.map((e) => ({ e, d: D().distOf(e) })).filter((x) => x.d);
    const pick = cands.find((x) => x.e.kind === "range_end") || cands.sort((a, b) => b.d.buckets.length - a.d.buckets.length)[0];
    const spot = series[series.length - 1][1];
    const facts = [];
    for (const e of evs) {
      if (pick && e === pick.e) continue;
      if (e.kind === "point_price") {
        const m = D().survivalMedian(e);
        if (m != null) facts.push(html`<li><a class="link" href="#event.${e.id}">${e.title}</a>${T("：")}${T("价格高于 {k} 的概率约 50%（市场定价的中位数）", { k: fmt.num(m, opts.nd) })}</li>`);
      } else if (e.kind === "touch") {
        const t = D().touchLevels(e, spot);
        const parts = [...t.up.map((x) => T("向上触及 {k}：{p}", { k: fmt.num(x.k, opts.nd), p: fmt.pct(x.p, 0) })), ...t.down.map((x) => T("向下触及 {k}：{p}", { k: fmt.num(x.k, opts.nd), p: fmt.pct(x.p, 0) }))];
        if (parts.length) facts.push(html`<li><a class="link" href="#event.${e.id}">${e.title}</a>${T("：")}${parts.join(T("；"))}</li>`);
      }
    }
    return {
      id: "pd-" + under.replace(/[^a-z]/gi, ""),
      series, pick, spot,
      html: html`<section class="card card-pad dash-card">
        <div class="card-head"><h3>${title}</h3>${pick ? WL.ui.usagePill(pick.e.usage) : ""}</div>
        <div class="chart" id="pd-${under.replace(/[^a-z]/gi, "")}"></div>
        <div class="chart-legend" style="margin-top:8px"><span><i class="lg-line"></i>${T("{name} 日线", { name: mk ? mk.label : under })}</span>${pick ? html`<span><i class="lg-bar"></i>${T("期末各区间占比")}</span>${pick.d.missing ? "" : html`<span><i class="lg-median"></i>${T("市场定价中位数")}</span>`}` : ""}<span><i class="lg-spot"></i>${T("现价")}</span></div>
        <p class="tiny muted pd-foot" data-foot="${under}" style="margin-top:8px"></p>
        ${facts.length ? html`<ul class="pd-facts">${facts}</ul>` : ""}
      </section>`,
    };
  }

  function footText(stats, pick, opts) {
    if (!pick || !stats) return T("右侧暂无可换算的期末价格分布。");
    const d = pick.d;
    const n = (v) => fmt.num(v, opts.nd);
    const parts = [T("右侧是「{title}」各区间的报价，按合计 {sum} 换算成 100%", { title: pick.e.title, sum: fmt.pct(d.sum) })
      + (d.missing ? T("（{n} 档没有报价：只是已报价区间的相对占比，不是完整分布，因此不给中位数）", { n: d.missing }) : "") + (d.clipped ? T("（阶梯有倒挂，负值按 0 计）") : "") + T("。")];
    if (stats.median && !stats.median.open) parts.push(T("市场定价中位数约 {m}，现价 {s}", { m: n(stats.median.v), s: n(stats.spot) })
      + (stats.q25 && stats.q75 && !stats.q25.open && !stats.q75.open ? T("；一半概率落在 {a}–{b}。", { a: n(stats.q25.v), b: n(stats.q75.v) }) : T("。")));
    const t = [];
    if (stats.tails.above > 0.0005) t.push(T("高于 {k} 合计 {p}", { k: n(stats.hi), p: fmt.pct(stats.tails.above) }));
    if (stats.tails.below > 0.0005) t.push(T("低于 {k} 合计 {p}", { k: n(stats.lo), p: fmt.pct(stats.tails.below) }));
    if (t.length) parts.push(T("图外：{list}。", { list: t.join(T("，")) }));
    parts.push(T("这是交易价格隐含的分布，不是预测。"));
    return WL.ui.sj(parts);
  }

  // 数据状态：报价截至、本版生成、各来源的正常 / 延迟 / 未知（本版生成时按各自检查间隔判定，见 status.js）、覆盖范围与已知缺口。
  // 默认收起成一句，帮读者分清“市场没变化”和“本站没取到新数据”：检查成功但买卖价相同，写“与每次检查相同”
  const SRC_STATE = { ok: ["正常", "ok"], late: ["延迟", "warn"], unknown: ["未知", ""] };
  const OVERALL = { ok: "各来源正常", late: "有来源延迟", unknown: "有来源状态未知", stale: "本版已过时" };
  function statusLine(snap, now) {
    const srcs = (snap.status && snap.status.sources) || [];
    const evs = snap.events || [];
    const open = evs.filter((e) => !WL.comp.isSettled(e));
    const miss = open.map((e) => ((e.outcomes || []).length > 1 ? e.outcomes.filter((o) => o.mid == null && !o.settled).length : 0));
    const tiers = miss.reduce((a, b) => a + b, 0);
    const noCmp = open.filter((e) => !e.change || e.change.d24h_pp == null).length;
    const since = snap.health && snap.health.first_quote_at;
    const pubSt = WL.status.publish(snap.meta, now);
    const all = WL.status.overall(srcs, snap.meta, now);
    const still = WL.status.unchanged(evs, snap.meta.as_of, 24);
    const pill = (st) => html`<span class="pill ${SRC_STATE[st] ? SRC_STATE[st][1] : ""}">${T((SRC_STATE[st] || SRC_STATE.unknown)[0])}</span>`;
    return html`<details class="card status-line">
      <summary><b>${T("数据状态")}</b><span class="pill ${all === "ok" ? "ok" : all === "unknown" ? "" : "warn"}">${T(OVERALL[all])}</span><span>${T("报价截至 {t} 东京", { t: fmt.time(snap.meta.as_of) })} · ${T("本版生成于 {t}", { t: fmt.time(snap.meta.generated_at) })}</span><span class="muted">${T("展开看各来源状态与已知缺口")}</span></summary>
      <div class="status-body">
        ${pubSt.late ? html`<p class="small warn">${T("本版生成于 {t} 东京，已超过 {d}没有更新。下表是那时的状态；之后各来源是否正常，本站无法确认。", { t: fmt.time(snap.meta.generated_at), d: pubSt.minutes >= 120 ? T("{n} 小时", { n: Math.floor(pubSt.minutes / 60) }) : T("{n} 分钟", { n: pubSt.minutes }) })}</p>` : ""}
        <div class="table-wrap"><table class="table">
          <thead><tr><th>${T("来源")}</th><th>${T("状态")}</th><th class="r">${T("最近一次成功检查（东京）")}</th></tr></thead>
          <tbody>${srcs.map((x) => html`<tr><td>${T(x.label)}${x.expected_s ? html`<div class="tiny muted">${x.expected_s < 3600 ? T("每 {n} 分钟检查", { n: Math.round(x.expected_s / 60) }) : T("每 {n} 小时检查", { n: Math.round(x.expected_s / 3600) })}</div>` : ""}</td><td>${pill(x.state)}</td><td class="r">${x.last_success ? html`${fmt.time(x.last_success)} <span class="muted">${fmt.rel(x.last_success, now)}</span>` : html`<span class="muted">${T("未知")}</span>`}</td></tr>`)}</tbody>
        </table></div>
        <ul class="status-gaps">
          <li>${T("覆盖范围：只追踪本站筛选的 {n} 个事件，不代表整个预测市场。", { n: evs.length })} <a class="link" href="../method/">${T("数据来源与选择方法")}</a></li>
          ${tiers ? html`<li>${T("{e} 个事件里共有 {k} 档没有双边报价，这些档位不参与比较。", { e: miss.filter(Boolean).length, k: tiers })}</li>` : ""}
          ${noCmp ? html`<li>${T("{n} 个事件暂时没有可比较的 24 小时变化。", { n: noCmp })}</li>` : ""}
          ${still.length ? html`<li>${T("{n} 个事件的买卖价已超过 24 小时与每次检查相同：检查取到了报价，只是挂单没有变动，不等于事件没有新进展。", { n: still.length })}</li>` : ""}
          ${since ? html`<li>${T("本站自采报价从 {t} 东京开始；更早的走势用平台成交价回填，标“≈”。", { t: fmt.time(since) })}</li>` : ""}
        </ul>
        <p class="tiny muted">${T("状态按各来源应有的检查间隔判定：超过两倍间隔再加 10 分钟仍没有成功检查算“延迟”；没有记录写“未知”，不据此推断正常。判定时刻是本版生成时。")}</p>
      </div>
    </details>`;
  }

  // 没有明显变化时补一句盘口来源的状态：延迟或本版已过时，就不能把“变化小”当成市场平静
  function quotesNote(snap, now) {
    const q = ((snap.status && snap.status.sources) || []).find((x) => x.key === "quotes");
    if (WL.status.publish(snap.meta, now).late) return T("注意：本版已过时，这是生成时的情况。");
    if (q && q.state === "late") return T("注意：盘口来源延迟（最近一次成功检查 {t} 东京），这里的变化可能没反映最新报价。", { t: fmt.time(q.last_success) });
    return "";
  }

  // 最近 24 小时的变化点（与事件页时间线同一份结果）：没有就说明变化可能是逐步累积或单次跳动
  function shiftLine(e, snap) {
    const m = e.timeline && e.timeline.last_shift;
    if (m && Date.parse(snap.meta.as_of) - Date.parse(m.confirmed_at) <= 24 * 3600e3) return WL.comp.shiftText(m);
    return T("过去 24 小时没有持续两个小时桶以上的变化点：变化可能是逐步累积，也可能是单次跳动。");
  }

  // 变化后看什么：只给主榜前三条，固定三行（发生了什么 / 能怎么参考 / 下一步看什么）。
  // 不自动写“受某消息推动”：没有可核验的原因就明说不作因果归因
  function nextSteps(snap, evs) {
    const rows = evs.slice(0, 3).map((e) => {
      const c = e.change || {};
      const d = c.d24h_pp;
      const mid = (e.quote || {}).mid;
      const approx = c.d24h_anchor === "backfill";
      const from = mid != null && d != null ? mid - d / 100 : null;
      const qn = WL.comp.quotedOf(e);
      const cal = (snap.calendar || []).find((x) => (x.related_events || []).includes(e.id) && x.at === e.next_event_at);
      const when = e.next_event_at ? (e.next_event_time_known === false ? T("{d}（具体时刻未公布）", { d: fmt.date(e.next_event_at) }) : T("{t} 东京", { t: fmt.time(e.next_event_at) })) : "";
      const what = cal ? cal.title : e.next_event_kind === "close" ? T("平台交易截止") : T("下一个已登记的官方日程");
      return html`<div class="ns-item">
        <a class="link" href="#event.${e.id}"><b>${e.title}</b></a>
        <dl class="kv small">
          <dt>${T("发生了什么")}</dt><dd>${T("「{o}」过去 24 小时 {d} 个百分点", { o: e.outcome_full || e.outcome || "", d: fmt.pp(d) })}${from != null ? T("（{a} → {b}）", { a: (approx ? "≈" : "") + fmt.pct(from), b: fmt.pct(mid) }) : ""}${approx ? T("；起点是平台历史成交价，与中间价口径不同") : ""}</dd>
          <dt>${T("持续的变化")}</dt><dd>${shiftLine(e, snap)}</dd>
          <dt>${T("能怎么参考")}</dt><dd>${e.usage ? T(USAGE_SHORT[e.usage.level] || e.usage.label) : "—"}${T("：")}${qn ? T("另 {k} 档没有双边报价，不能据此补全整体分布", { k: qn.n - qn.q }) : T("主档有双边报价，盘口达标")}</dd>
          <dt>${T("下一步看什么")}</dt><dd>${e.next_event_at ? html`${what} · ${when}${cal && cal.url ? html` · <a class="link" href="${cal.url}" target="_blank" rel="noopener noreferrer">${T("官方日程页")}</a>` : ""}` : T("没有已登记的下一个节点")}</dd>
        </dl>
      </div>`;
    });
    return html`<section class="card card-pad next-steps" style="margin-top:14px">
      <div class="card-head"><h3>${T("变化后看什么")}</h3><span class="aside">${T("变化最大的前 {n} 个 · 固定模板", { n: rows.length })}</span></div>
      <div class="stack-sm">${rows}</div>
      <p class="tiny muted" style="margin-top:8px">${T("本站尚未核实这些变化的原因，因此不作因果归因；有可靠来源时才会写原因。")}</p>
    </section>`;
  }

  WL.views.today = function (snap, ctx) {
    const st = ctx.store("today");
    st.sort = st.sort || "relevance";
    const b = snap.brief;
    const now = ctx.now;
    const live = snap.meta.mode === "live";
    const pub = snap.meta.mode === "public";
    const sigs = snap.signals || [];
    const top = (b.top || []).map((id) => sigs.find((s) => s.id === id)).filter(Boolean);
    const watchN = sigs.filter((s) => s.tier === "watch" && s.status !== "superseded").length;
    const needProfile = live && !snap.profile;
    const pending = b.pending_review;
    const cov = snap.health.coverage_7d;
    const th = (snap.opportunities && snap.opportunities.theoretical_research) || [];
    const passed = th.filter(WL.comp.oppPassed).length;
    const needs = snap.fx && snap.fx.needs;

    // 官方不预告具体时刻的日程只写日期，按东京日期倒数（与日历页、首页摘要同一规则）
    const cats = b.catalysts.slice(0, 6).map((c) => {
      const d = fmt.md(c.at);
      const noTime = c.time_known === false;
      return html`<div class="tl-item">
        <div class="tl-date"><b>${d.date}</b><span>${d.wd}${noTime ? "" : ` ${d.hh}:${d.mm}`}</span></div>
        <div class="tl-body"><div class="t">${c.title}</div>
          <div class="s"><span>${noTime ? fmt.dayCountdown(c.at, now) : fmt.countdown(c.at, now)}</span>${noTime ? html`<span class="warn">${T("具体时刻未公布")}</span>` : (c.key || "").startsWith("close_") ? html`<span>${T("平台规则时间")}</span>` : html`<span class="${c.verified ? "ok" : "warn"}">${c.verified ? T("已核实时间") : T("时间未核实")}</span>`}</div>${c.time_note ? html`<div class="s"><span>${c.time_note}</span></div>` : ""}</div>
      </div>`;
    });

    const btc = priceCard(snap, "BTC-USD", T("比特币：走势与市场定价"), { nd: 0 });
    const jpy = priceCard(snap, "JPY=X", T("美元/日元：走势与市场定价"), { nd: 0 });
    const pol = D().policyStack(snap, now);
    const rateEv = (snap.events || []).find((e) => e.underlying === "fed_funds_upper");
    const rate = rateEv ? D().rateBars(rateEv) : "";
    const gaps = (b.gaps || []).map((g) => html`<li><span class="type">${g.label}</span><span>${g.items.join("；")}</span></li>`);

    const kpi = (href, value, label, cls) => html`<a class="kpi ${cls || ""}" href="${href}"><b>${WL.ui.nf(value)}</b><span>${label}</span></a>`;
    // 100% 不带小数：手机上 KPI 格放不下“100.0%”
    const covText = cov == null ? "—" : fmt.fixed(cov * 100, cov >= 0.9995 ? 0 : 1) + "%";
    const covLabel = WL.ui.coverageLabel(snap.health, "7 日采集覆盖", "启动以来采集覆盖（{d} 天）");
    const evs = snap.events || [];
    const nUse = (lv) => evs.filter((e) => e.usage && e.usage.level === lv).length;
    const overN = evs.filter((e) => e.change && e.change.d24h_pp != null && Math.abs(e.change.d24h_pp) >= (e.rethink_pp || 10)).length;
    // 变化榜与官网首页、日报同一份：主榜只列可观察的事件，弱证据另列，暂不用与已结算不列
    const byIds = (ids) => (ids || []).map((id) => WL.comp.eventById(snap, id)).filter(Boolean);
    const movers = byIds(b.movers);
    const weakMovers = byIds(b.weak_movers);
    const kpis = pub
      ? html`${kpi("#events", evs.length, T("个事件"))}
            ${kpi("#events", nUse("observe"), T("可观察"))}
            ${kpi("#events", nUse("verify"), T("弱证据"))}
            ${kpi("#events", nUse("no_judgment"), T("暂不用"))}
            ${kpi("#events", overN, T("个超过重估阈值"), overN ? "attn" : "")}
            ${kpi("#about", covText, covLabel)}`
      : html`${kpi("#cards", top.length, "条值得研究")}
            ${kpi("#cards", watchN, "条在观察区")}
            ${kpi("#opps", `${passed}/${th.length}`, "机会组合通过")}
            ${kpi("#review", pending, "项待你确认", pending ? "attn" : "")}
            ${kpi("#fx", needs ? (needs.items.length ? needs.items.length + " 项" : "未录入") : "—", "日元支出计划", needs && !needs.items.length ? "attn" : "")}
            ${kpi("#system", covText, covLabel)}`;
    const nextCard = html`<section class="card card-pad ${pub ? "dash-card" : ""}">
              <div class="card-head"><h3>${T("接下来")}</h3><span class="aside">${T("东京时间")}${pub ? html` · <a class="link" href="#calendar">${T("完整日历")}</a>` : ""}</span></div>
              <div class="timeline">${cats}</div>
            </section>`;
    const changes = pub
      ? html`<div class="section-title"><h2>${T("24 小时变化最大")}</h2><span class="aside">${T("只列可观察的事件")} · <a class="link" href="#events">${T("全部事件")}</a></span></div>
          ${movers.length ? html`<div class="ev-list">${movers.map((e) => WL.comp.eventRow(snap, e, now))}</div>${nextSteps(snap, movers)}` : html`<div class="card card-pad"><p class="small ink2">${T("可观察的事件 24 小时变化都不足 1 个百分点。")}${quotesNote(snap, now)}</p></div>`}
          ${weakMovers.length ? html`<div class="section-title" style="margin-top:14px"><h3>${T("弱证据事件的变化")}</h3><span class="aside">${T("盘口薄或各档报价不一致，只看大致方向")}</span></div>
            <div class="ev-list">${weakMovers.map((e) => WL.comp.eventRow(snap, e, now))}</div>` : ""}`
      : html`<div class="section-title"><h2>最值得研究的变化</h2><a class="aside link" href="#cards">全部决策卡</a></div>
            ${top.length ? html`<div class="stack-sm" style="gap:12px">${top.map((s) => WL.comp.signalCard(snap, s, now))}</div>`
              : html`<div class="card card-pad"><p style="font-size:17px;font-weight:600">今天没有值得进一步关注的变化。</p>
                  <p class="small ink2" style="margin-top:6px">${snap.health.approved_events ? "与你相关、数据质量够的事件，概率变化都在重估阈值以内。这是正常、有价值的结果：今天可以不花时间在这里。" : raw(`还没有已批准的事件。正式决策卡只来自你批准过的映射：<a class="link" href="#review">去审核</a>。`)}</p></div>`}
            ${watchN ? html`<p class="small ink2" style="margin-top:10px">另有 ${watchN} 张卡在<a class="link" href="#cards" data-set-tier="watch">观察区</a>：数据薄或与你相关度低，暂不用于判断。</p>` : ""}`;

    return {
      title: T("今日"),
      html: html`
        <section class="brief-hero">
          <div class="brief-date"><span class="day">${fmt.dateLong(snap.meta.as_of)}</span><span class="meta">${pub
            ? `${T("数据截至 {t} 东京", { t: fmt.time(snap.meta.as_of) })} · ${T("报价每 5 分钟采集")} · ${snap.meta.every_minutes ? T("页面每 {n} 分钟生成一次", { n: snap.meta.every_minutes }) : T("页面不定期更新")}`
            : live ? `行情更新于 ${fmt.time(snap.health.last_quote_at)} 东京（每 5 分钟采集）· 本页随行情实时生成 · 每天 07:00 另存日报`
            : `07:00 日报 · 程序模板生成 · 数据截至 ${fmt.time(snap.health.last_quote_at)} 东京`}</span></div>
          <p class="brief-headline">${b.headline}</p>

    return html`<section class="card card-pad" style="margin-top:16px">
      <div class="card-head"><h3>${T("结果档案")}</h3><span class="aside">${T("官方日程与平台结算分开记录")}</span></div>
      <div class="arch-two">
        <div><div class="eyebrow">${T("官方日程（计划）")}</div>
          ${off ? html`<b>${off.title || T("官方日程")}</b>
            <span>${off.time_known === false ? T("{d}（具体时刻未公布）", { d: fmt.date(off.at) }) : T("{t} 东京", { t: fmt.time(off.at) })}${off.url ? html` · <a class="link" href="${off.url}" target="_blank" rel="noopener noreferrer">${T("官方日程页")}</a>` : off.source ? " · " + T("来源：") + off.source : ""}</span>
            <span class="warn">${T("这是登记的计划时间；本站没有核对实际公布时间和内容")}</span>`
            : html`<span class="muted">${T("没有登记对应的官方日程")}</span>`}</div>
        <div><div class="eyebrow">${T("平台结算")}</div>
          <b>${ar.platform.outcome ? T("「{o}」结算为“{r}”", { o: ar.tracked, r: { YES: T("是"), NO: T("否") }[ar.platform.outcome] || ar.platform.outcome }) : T("见结算记录")}</b>
          <span>${T("{t} 东京", { t: fmt.time(ar.platform.at) })} · <a class="link" href="${ar.platform.evidence_url}" target="_blank" rel="noopener noreferrer">${T("结算记录")}</a></span></div>
      </div>
      ${pts.length ? html`<div class="table-wrap"><table class="table arch">
        <thead><tr><th>${T("结果")}</th>${pts.map((p) => html`<th class="r">${T(POINT[p.key] || p.key)}<div class="tiny muted">${p.target ? fmt.time(p.target) : T("无记录")}</div>${p.key === "last_valid" && p.vs_official ? html`<div class="tiny ${p.vs_official === "after" ? "warn" : "muted"}">${T(VS[p.vs_official])}</div>` : ""}</th>`)}</tr></thead>
        <tbody>${labels.map((l, li) => html`<tr class="${l === ar.tracked ? "tracked" : ""}"><td>${l}</td>${pts.map((p, pi) => cell(p, l, pi, li))}</tr>`)}</tbody>
      </table></div>${detail()}` : ""}
      <p class="tiny muted" style="margin-top:8px">${T("各时点取该时刻之前 3 小时内系统实际保存的最后一条自采报价，买价、卖价出自同一条记录；没有自采报价时改用平台成交价回填并标“≈”，再没有就写“缺失”，不事后补写。")}${anySrcB ? T("成交价回填与中间价口径不同，不能直接相减。") : ""}${sems.size > 1 ? html`<span class="warn">${T("各时点的规则语义不同，前后口径可能不一致，不能直接连成一条可比序列。")}</span>` : vers.length > 1 ? T("各时点的规则文本版本不同，但语义相同。") : vers.length ? T("当时的规则版本：{v}。", { v: vers.join("、") }) : T("这些时点之前，本站还没有留存这个市场的规则版本。")}${anyQ ? T("数据质量取自本站当时每小时的记录，点格子可看。") : T("当时的“能否参考”标签没有留存。")}</p>
      <p class="small ink2" style="margin-top:6px">${hasBefore ? T("会前定价看“计划公布前”各列：那时官方还没有公布。") : off ? T("官方没有预告具体公布时刻，所以档案不设“计划公布前”各列。") : ""}${lastP && lastP.vs_official !== "before" ? T("“平台结算前最后有效报价”可能已在官方公布之后，反映的是公布后向结果收敛的价格，不能当作会前判断。") : ""}${lastGap >= 6 * 3600 ? T("“平台结算前最后有效报价”比结算早 {d}：此后主档没有买卖两边都有的报价（价格贴近 0 或 1 时常见），这一列不是结算时的价格。", { d: fmt.duration(lastGap) }) : ""}${T("单个案例只能说明这一次会前怎样定价、与平台结算是否一致，不能用来评价市场或本站的整体准确率。")}</p>
      ${ver}
      ${perma ? html`<p class="tiny" style="margin-top:4px"><a class="link" href="${perma}">${T("这份档案的固定页面")}</a> <span class="muted">${T("（事件移出看板后仍可访问）")}</span></p>` : ""}
    </section>`;
  }

  // ---------------------------------------------------------------- detail
  WL.views.event = function (snap, ctx) {
    const ev = WL.comp.eventById(snap, ctx.param);
    if (!ev) return { title: T("事件"), html: html`<a class="back" href="#events">${icon("back")}${T("关注事件")}</a>${empty(T("找不到这个事件"), T("它可能已被移出关注清单。"))}` };
    const st = ctx.store("event:" + ev.id);
    st.range = st.range || "7d";
    st.table = !!st.table;
    const now = ctx.now;
    const pub = snap.meta.mode === "public";
    const done = WL.comp.isSettled(ev);     // 已结算：首屏是结果与结算，报价与质量只作结算前的历史
    const q = ev.quote;
    const prev = prevMid(ev);
    const signals = (snap.signals || []).filter((s) => s.event_id === ev.id);
    const series = ev.series[st.range] || [];
    const pts = series.map((r) => ({ t: r[0], lo: r[1], hi: r[2], v: r[3], src: r[4] }));
    // 回填（平台成交价）与自采中间价口径不同：图上虚线、表格逐行标来源
    const hasBack = pts.some((p) => p.src === "b");
    const srcName = (r) => (r[4] === "b" ? T("平台成交价（回填）") : T("自采中间价"));
    // 事件时间线（timeline.py，事件页、今日页、日报共用）：日程、规则版本、质量等级、结算画竖线，变化点画在走势上
    const tl = ev.timeline || { marks: [] };
    const markers = tl.marks.filter((m) => m.kind !== "shift")
      .map((m) => ({ t: Date.parse(m.at), label: WL.comp.markShort(m), dash: m.kind === "schedule" && m.time_known === false }));
    for (const s of signals) markers.push({ t: Date.parse(s.created_at), label: "决策卡" });
    const shiftDots = tl.marks.filter((m) => m.kind === "shift").map((m) => ({ t: Date.parse(m.confirmed_at), v: m.to, label: WL.comp.markShort(m) }));
    const tlRows = [...tl.marks].reverse();
    const tlRow = (m) => html`<li class="tl-${m.kind}"><span class="tl-when">${WL.comp.markWhen(m)}</span><span>${WL.comp.markText(m, ev)}</span></li>`;
    const tlSection = html`<details class="timeline" ${tlRows.length && tlRows.length <= 6 ? "open" : ""}>
      <summary><b>${T("时间线")}</b> <span class="muted small">${tlRows.length ? T("{n} 项 · 近 30 天与未来 14 天", { n: tlRows.length }) : T("近 30 天没有可标的记录")}</span></summary>
      ${tlRows.length ? html`<ul class="tl-list">${tlRows.map(tlRow)}</ul>` : ""}
      <p class="tiny muted">${T("变化点：本站自采的每小时中间价相对上一个稳定水平偏离至少 {thr} 个百分点、且下一小时仍在同一侧才标，单次跳动不标；回填的成交价不参与。这些标记只说明同期发生了什么，不说明价格为什么变。", { thr: fmt.fixed(tl.threshold_pp || 3, 0) })}</p>
      ${pub && snap.meta.feeds && !done && ev.next_event_at && /^[a-z0-9_]+$/.test(ev.id) ? html`<p class="tiny"><a class="link" href="../ics/${ev.id}.ics" download>${T("下载日历文件（.ics）")}</a> <span class="muted">${T("下载的是当时登记的日程，之后改期不会自动更新。")}</span></p>` : ""}
    </details>`;

    const E = ev.eligibility;
    const eligRow = (k, label, v) => html`<div class="elig-row ${v.ok ? "ok" : "no"}">${icon(v.ok ? "check" : "minus")}<div><b>${label}</b><span>${v.ok ? (v.reason || T("数据条件满足（不代表结论可靠）")) : v.reason}</span></div></div>`;

    const outcomes = ev.outcomes ? html`<section class="card card-pad">
        <div class="card-head"><h3>${T("结果分布")}</h3><span class="aside">${done ? T("各档的结算结果") : T("中间价；竖线为 24 小时前")}</span></div>
        <div class="hbars">${ev.outcomes.map((o) => {
          const prevO = o.mid != null && o.d24h_pp != null ? o.mid - o.d24h_pp / 100 : null;
          return html`<div class="hbar ${o.label === ev.outcome || (o.key != null && o.key === ev.outcome) ? "tracked" : ""}">
            <span class="lbl" title="${o.label}">${o.label}</span>
            <span class="track"><span class="fill" style="width:${(o.mid || 0) * 100}%"></span>${prevO != null ? raw(`<span class="ghost" style="left:${prevO * 100}%"></span>`) : ""}</span>
            <span class="v">${o.settled ? html`<b class="small">${o.settled}</b>` : html`<b>${fmt.pct(o.mid)}</b>${o.d24h_pp != null ? delta(o.d24h_pp) : ""}`}</span></div>`;
        })}</div>
        ${ev.basket_check && ev.basket_check.sum_mid != null ? html`<p class="tiny muted" style="margin-top:10px">${T("各档中间价合计 {p}%（{q}/{n} 档有双边报价）", { p: fmt.pctBare(ev.basket_check.sum_mid), q: ev.basket_check.n_quoted, n: ev.basket_check.n_total })}${ev.basket_check.n_quoted === ev.basket_check.n_total && Math.abs(ev.basket_check.sum_mid - 1) > 0.02 ? T("：偏离 100%，只看相对高低") : ""}${ev.basket_check.complete === false ? T("；规则完整性存疑：") + ev.basket_check.gaps : ""}${T("。")}${pub ? html` <a class="link" href="../method/#g-sum">${T("为什么相加不是 100%")}</a>` : ""}</p>` : ""}
      </section>` : "";

    const tableRows = series.filter((_, i) => i % Math.max(1, Math.floor(series.length / 14)) === 0 || _ === series[series.length - 1]).reverse();

    return {
      title: ev.title,
      subtitle: themeOf(snap, ev.theme).name,
      html: html`
        <a class="back" href="#events">${icon("back")}${pub ? T("事件") : "关注事件"}</a>
        <div class="page-head">
          <div class="row">${themeTag(snap, ev.theme)}${pub ? "" : html`<span class="muted">·</span>${mappingPill(ev.mapping.status)}`}${ev.weak && !done ? html`<span class="pill sm warn" title="${(ev.liquidity && ev.liquidity.reason) || ""}">${T("盘口薄")}</span>` : ""}${ev.warmup && !done ? pill(T("预热中"), "") : ""}<span class="pill sm ghost">${ev.venue === "kalshi" ? "Kalshi" : "Polymarket"}</span></div>
          <h1>${ev.title}</h1>
          <p>${ev.question}${T("。追踪结果：")}${ev.outcome}${T("。")}</p>
        </div>

        ${ev.mapping.status !== "approved" ? html`<div style="margin-bottom:16px">${note(raw(`${WL.ui.esc(E.observe.reason)}：该市场不参与任何正式信号。<a class="link" href="#review">去映射审核</a>`), "alert")}</div>` : ""}

        ${ev.reading ? html`<div class="grid-2" style="margin-bottom:16px">
          <section class="card card-pad reading">
            <div class="card-head"><h3>${done ? T("结果与结算") : T("盘口说明什么")}</h3><span class="aside">${done ? T("平台结算于 {t} 东京", { t: fmt.time(ev.settlement.at) }) : html`${T("参考强度 {v}", { v: ev.reading.confidence })} · ${T("按 {t} 报价生成", { t: fmt.time(q.received_at) })}`}</span></div>
            ${ev.usage && !done ? html`<div class="row" style="margin-bottom:8px">${WL.ui.usagePill(ev.usage)}<span class="small ink2">${ev.usage.why}</span></div>
              <p class="tiny muted" style="margin:-2px 0 8px">${T("标签回答这份报价适不适合据此观察；参考强度说明证据有多充分。")}${pub ? html` <a class="link" href="../method/#g-usable">${T("读数指南")}</a>` : ""}</p>` : ""}
            <p class="reading-head">${ev.reading.headline}</p>
            <ul class="reasons">${ev.reading.points.map((x) => html`<li>${x}</li>`)}</ul>
            <p class="tiny muted" style="margin-top:10px">${ev.reading.disclaimer}</p>
          </section>
          ${ev.note ? html`<section class="card card-pad">
            <div class="card-head"><h3>${T("这个市场在问什么")}</h3></div>
            <dl class="note-dl">
              ${ev.note.what ? html`<dt>${T("问题")}</dt><dd>${ev.note.what}</dd>` : ""}
              ${ev.note.settle ? html`<dt>${T("怎么结算")}</dt><dd>${ev.note.settle}</dd>` : ""}
              ${ev.note.read ? html`<dt>${T("怎么看")}</dt><dd>${ev.note.read}</dd>` : ""}
              ${ev.note.caveat ? html`<dt>${T("注意")}</dt><dd>${ev.note.caveat}</dd>` : ""}
            </dl>
          </section>` : ""}
        </div>` : ""}

        <div class="ev-hero">
          ${done ? html`<section class="card card-pad quote-box">
            <div class="eyebrow">${T("平台结算结果")}${ev.outcome_full ? html` · <span style="color:var(--accent)">${ev.outcome_full}</span>` : ""}</div>
            <div class="result-big">${WL.comp.resultText(ev)}</div>
            <div class="note">${icon("flag")}<div><b>${ev.settlement.label}</b>${ev.settlement.outcome ? T("：「{o}」结算为“{r}”", { o: ev.outcome, r: { YES: T("是"), NO: T("否") }[ev.settlement.outcome] || ev.settlement.outcome }) : ""}${ev.settlement.payout != null ? T("（每份回款 {p}）", { p: ev.settlement.payout }) : ""} · ${fmt.time(ev.settlement.at)} · <a class="link" href="${ev.settlement.evidence_url}" target="_blank" rel="noopener noreferrer">${T("结算记录")}</a></div></div>
            <p class="tiny muted">${T("这是平台的结算结果，本站没有另行核对官方公布；官方结果以规则里的结算来源为准。结算后不再有双边报价，下面的走势和表格都是结算前的历史。")}${pub ? html` <a class="link" href="../method/#g-settled">${T("已结算为什么还有价格")}</a>` : ""}</p>
          </section>` : html`<section class="card card-pad quote-box">
            <div class="quote-figs">
              <div>
                <div class="eyebrow">${T("中间价")}${ev.outcome_full ? html` · <span style="color:var(--accent)">${ev.outcome_full}</span>` : ""}${pub ? html` · <a class="link" href="../method/#g-price">${T("这个数字代表什么")}</a>` : ""}</div>
                ${q.mid != null ? html`<div class="hero-num" style="margin-top:6px">${WL.ui.nf(fmt.pctBare(q.mid))}<small class="muted" style="font-size:.45em;font-weight:500;margin-left:2px">%</small></div>`
                  : html`<div class="bignum muted" style="margin-top:6px">—</div><div class="small muted">${E.probability.reason}${T("；中间价与基于它的变化为空")}</div>`}
              </div>
              <div class="change-pair">
                <div>${delta(ev.change.d24h_pp, { rethink: ev.rethink_pp, approx: ev.change.d24h_anchor === "backfill" })}<span class="lbl">${T("24 小时")}${ev.change.d24h_anchor === "backfill" ? " · " + T("近似") : ""}${ev.change.d24h_reason ? " · " + ev.change.d24h_reason : ""}</span></div>
                <div>${delta(ev.change.d7d_pp, { approx: ev.change.d7d_anchor === "backfill" })}<span class="lbl">${T("7 日")}${ev.change.d7d_anchor === "backfill" ? " · " + T("近似") : ""}${ev.change.d7d_reason ? " · " + ev.change.d7d_reason : ""}</span></div>
              </div>
            </div>
            ${ev.settlement ? html`<div class="note">${icon("flag")}<div><b>${ev.settlement.label}</b>${ev.settlement.outcome ? T("：「{o}」结算为“{r}”", { o: ev.outcome, r: { YES: T("是"), NO: T("否") }[ev.settlement.outcome] || ev.settlement.outcome }) : ""}${ev.settlement.payout != null ? T("（每份回款 {p}）", { p: ev.settlement.payout }) : ""} · ${fmt.time(ev.settlement.at)} · <a class="link" href="${ev.settlement.evidence_url}" target="_blank" rel="noopener noreferrer">${T("结算记录")}</a></div></div>` : ""}
            <div>${pstrip(q, prev, { large: true, scale: true })}</div>
            <div class="quote-sub">
              <span>${T("买")} <b>${fmt.pct(q.bid)}</b>${q.bid_size != null ? html` <span class="muted">× ${fmt.num(q.bid_size)}</span>` : ""}</span>
              <span>${T("卖")} <b>${fmt.pct(q.ask)}</b>${q.ask_size != null ? html` <span class="muted">× ${fmt.num(q.ask_size)}</span>` : ""}</span>
              <span>${T("价差")} <b>${q.spread_pp != null ? fmt.fixed(q.spread_pp, 1) + " pp" : "—"}</b></span>
              <span>${T("重估阈值")} <b>${ev.rethink_pp} pp</b></span>
            </div>
            <div class="times">
              <div><span>${T("源时间")}</span><b>${fmt.time(q.source_ts)}</b></div>
              <div><span>${T("收到时间")}</span><b>${fmt.time(q.received_at)}</b></div>
              <div><span>${T("可用时间")}</span><b>${fmt.time(q.available_at)}</b></div>
            </div>
            ${q.unchanged_since && Date.parse(snap.meta.as_of) - Date.parse(q.unchanged_since) >= 6 * 3600e3 ? html`<p class="tiny muted">${T(q.unchanged_since_lb ? "买卖价至少从 {t} 东京起就与之后每次检查相同：挂单没有变动，不等于事件没有新进展。" : "买卖价自 {t} 东京起与之后每次检查相同：挂单没有变动，不等于事件没有新进展。", { t: fmt.time(q.unchanged_since) })}</p>` : ""}
            ${ev.change.d24h_anchor === "backfill" || ev.change.d7d_anchor === "backfill" ? html`<p class="tiny muted">${T("变化的历史锚点来自平台价格历史回填（成交价序列，不含买卖价），不是系统当时亲自看到的报价。")}</p>` : ""}
            <p class="tiny muted">${T("变化按未取整的报价计算；显示值各自四舍五入，相减可能与显示的变化差 0.1。")}</p>
            <p class="tiny muted">${T("时间语义：{x}；回测只用“可用时间”之后的数据。", { x: q.source_time_status === "quote_time" ? T("平台时间戳为报价时间") : q.source_time_status === "response_time" ? T("平台时间戳为响应生成时间") : T("平台未给时间戳") })}</p>
          </section>`}
          <section class="card card-pad">
            <dl class="kv">
              ${pub ? "" : html`<dt>决策用途</dt><dd>${ev.decision}</dd>
              <dt>期限</dt><dd>${ev.horizon}</dd>
              <dt>影响程度</dt><dd>${ev.impact ? IMPACT[ev.impact] || ev.impact : html`<span class="muted">未设定（批准时填写）</span>`}</dd>`}
              <dt>${T("问题类型")}</dt><dd>${ev.kind_label || "—"}</dd>
              ${done ? html`<dt>${T("规则原定截止")}</dt><dd>${fmt.time(ev.rules.close_time)}</dd>`
                : html`<dt>${ev.next_event_kind === "close" ? T("交易截止") : T("下次官方公布")}</dt><dd>${!ev.next_event_at ? "—" : ev.next_event_time_known === false
                  ? html`${fmt.date(ev.next_event_at)} <span class="muted">· ${T("具体时刻未公布")} · ${fmt.dayCountdown(ev.next_event_at, now)}</span>`
                  : html`${fmt.time(ev.next_event_at)} <span class="muted">· ${fmt.countdown(ev.next_event_at, now)}</span>`}</dd>`}
              <dt>${T("市场编号")}</dt><dd><span class="hash">${ev.market_ref}</span> <button class="copy-btn" data-action="copy" data-v="${ev.market_ref}">${T("复制")}</button></dd>
              <dt>${T("累计成交")}</dt><dd>${ev.volume_usd != null ? fmt.compactUsd(ev.volume_usd) : "—"}</dd>
              ${ev.rules.fee_rate != null ? html`<dt>${T("吃单费率")}</dt><dd>${ev.rules.fee_rate === "0" ? T("0（免费）") : ev.rules.fee_rate}</dd>` : ""}
              ${ev.url ? html`<dt>${T("平台页面")}</dt><dd><a class="link" href="${ev.url}" target="_blank" rel="noopener noreferrer">${T("在 Polymarket 打开")}</a></dd>` : ""}
            </dl>
            ${pub ? "" : html`<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">与你的联系</div>
