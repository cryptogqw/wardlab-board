/* views/calendar.js */
/* 近期日历：官方日程与平台交易截止分开列。官方公布与平台结算是两个独立的状态：
   本站只登记官方日程的时间，不自动判断官方是否已经公布；市场进度来自平台的结算记录。 */
(function (WL) {
  "use strict";
  const { html, pill } = WL.ui;
  const fmt = WL.fmt;
  const T = WL.T;
  const DAY = 86400000;
  // “全部”只是本站已登记的部分：官方日程和公开事件的平台交易截止都列到未来 75 天，不是所有市场事件
  const RANGES = [["7", "未来 7 天"], ["30", "未来 30 天"], ["all", "全部已登记（75 天内）"]];

  const isClose = (c) => (c.key || "").startsWith("close_");

  // 时刻未公布的日程按东京日期判断是否已过：当天过完才算过去
  function past(c, now) {
    if (c.time_known === false) return fmt.isoDay(c.at) < fmt.isoDay(now);
    return Date.parse(c.at) < now;
  }

  function dateCell(c) {
    const d = fmt.md(c.at);
    return html`<div class="tl-date"><b>${d.date}</b><span>${d.wd}${c.time_known === false ? "" : ` ${d.hh}:${d.mm}`}</span></div>`;
  }

  function certainty(c) {
    if (c.time_known === false) return html`<span class="warn">${T("具体时刻未公布")}</span>`;
    if (isClose(c)) return html`<span>${T("平台规则时间")}</span>`;
    return c.verified ? html`<span class="ok">${T("已核实时间")}</span>` : html`<span class="warn">${T("时间未核实")}</span>`;
  }

  function until(c, now) {
    if (c.time_known === false) return fmt.dayCountdown(c.at, now);
    return past(c, now) ? fmt.rel(c.at, now) : fmt.countdown(c.at, now);
  }

  // 市场进度：交易中 / 结算中 / 部分档位已结算 / 已结算（附结果）
  function market(ev) {
    if (WL.comp.isSettled(ev)) return pill(T("已结算") + T("：") + WL.comp.resultText(ev).replace(/^[^：:]*[：:]\s*/, ""), "info");
    if (ev.settlement) return pill(ev.settlement.label, "warn");
    const n = (ev.outcomes || []).filter((o) => o.settled).length;
    if (n) return pill(T("{n} 档已结算，其余交易中", { n }), "");
    return pill(T("交易中"), "ghost");
  }

  function related(snap, c) {
    const evs = (c.related_events || []).map((id) => WL.comp.eventById(snap, id)).filter(Boolean);
    if (!evs.length) return "";
    return html`<div class="cal-rel">${evs.map((ev) => html`<span><a class="link" href="#event.${ev.id}">${ev.title}</a>${market(ev)}</span>`)}</div>`;
  }

  function officialRow(snap, c, now) {
    const done = past(c, now);
    return html`<div class="tl-item cal-item">
      ${dateCell(c)}
      <div class="tl-body"><div class="t">${c.title}</div>
        <div class="s">${certainty(c)}<span>${T("官方进度：")}${done ? T("时间已过，本站未核对公布内容") : T("待公布")}</span>${c.url ? html`<span>${T("来源：")}<a class="link" href="${c.url}" target="_blank" rel="noopener noreferrer">${T("{s} 日程页", { s: c.source || "" })}</a></span>` : c.source ? html`<span>${T("来源：")}${c.source}</span>` : ""}<span>${until(c, now)}</span></div>
        ${c.time_note ? html`<div class="s"><span>${c.time_note}</span></div>` : ""}
        ${related(snap, c)}
      </div>
    </div>`;
  }

  function closeRow(snap, c, now) {
    return html`<div class="tl-item cal-item">
      ${dateCell(c)}
      <div class="tl-body"><div class="t">${c.title}</div>
        <div class="s">${certainty(c)}<span>${until(c, now)}</span></div>
        ${related(snap, c)}
      </div>
    </div>`;
  }

  WL.views.calendar = function (snap, ctx) {
    const st = ctx.store("calendar");
    st.range = st.range || "7";
    const now = ctx.now;
    const cal = (snap.calendar || []).slice().sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
    const horizon = st.range === "all" ? Infinity : now + Number(st.range) * DAY;
    const ahead = cal.filter((c) => !past(c, now) && Date.parse(c.at) <= horizon);
    const official = ahead.filter((c) => !isClose(c));
    const closes = ahead.filter(isClose);
    const recent = cal.filter((c) => !isClose(c) && past(c, now)).reverse();
    const settled = (snap.events || []).filter(WL.comp.isSettled);
    const card = (title, aside, rows, none) => html`<section class="card card-pad">
        <div class="card-head"><h3>${title}</h3><span class="aside">${aside}</span></div>
        ${rows.length ? html`<div class="timeline">${rows}</div>` : html`<p class="small muted">${none}</p>`}
      </section>`;
    return {
      title: T("日历"),
      subtitle: T("东京时间"),
      html: html`
        <div class="page-head"><h1>${T("近期日历")}</h1><p>${T("官方日程和平台交易截止分开列出，时间均为东京时间。官方公布与平台结算是两件事：本站登记官方日程的时间，不自动判断官方是否已经公布；市场是否结算以平台的结算记录为准。")}</p></div>
        <div class="toolbar"><div class="seg" role="group" aria-label="${T("时间范围")}">${RANGES.map(([k, l]) => html`<button data-action="range" data-v="${k}" aria-pressed="${st.range === k}">${T(l)}</button>`)}</div></div>
        <div class="stack">
          ${card(T("官方日程"), T("会议、声明与数据发布"), official.map((c) => officialRow(snap, c, now)), T("该范围内暂无已登记的官方日程。"))}
          ${card(T("平台交易截止"), T("平台规则时间，不等于观察时点"), closes.map((c) => closeRow(snap, c, now)), T("该范围内暂无已登记的平台交易截止。"))}
          ${recent.length ? card(T("最近已过"), T("近 7 天的官方日程"), recent.map((c) => officialRow(snap, c, now)), "") : ""}
          ${settled.length ? html`<section class="card card-pad">
            <div class="card-head"><h3>${T("结果档案")}</h3><span class="aside">${T("平台已结算的事件")}</span></div>
            <div class="stack-sm">${settled.map((ev) => html`<a class="row-between cal-done" href="#event.${ev.id}"><span><b>${ev.title}</b><span class="small ink2"> · ${WL.comp.resultText(ev)}</span></span><span class="small muted">${T("平台结算于 {t} 东京", { t: fmt.time(ev.settlement.at) })}</span></a>`)}</div>
          </section>` : ""}
        </div>
        <p class="tiny muted" style="margin-top:12px">${T("这里只列本站已登记的官方日程和公开关注事件的平台交易截止，最远到未来 75 天，不是全部市场事件。具体时刻未公布的日程只按日期列出，不给精确倒计时。日程来自官方网站，平台交易截止来自市场规则；两者都可能调整，以原始来源为准。")}</p>`,
      actions: {
        range(el) { st.range = el.dataset.v; ctx.rerender(); },
      },
    };
  };
})(window.WL = window.WL || {});

      e.preventDefault();
      WL.api.setInline(t.dataset.v);
      WL.api.load().then((s) => { useSnap(s); shell(); render(false); });
      return;
    }
    if (name === "toggleRail") {
      toggleRail();
      rebuild();
      return;
    }
    if (name === "cycleTheme") {
      const order = ["light", "dark", "system"];
      setTheme(order[(order.indexOf(getTheme()) + 1) % 3]);
      rebuild();
      return;
    }
    const acts = current && current.view.actions;
    if (acts && acts[name]) {
      if (t.tagName !== "INPUT") e.preventDefault();
      acts[name](t, e);
    }
  }

  async function boot() {
    document.documentElement.setAttribute("data-skin", SKIN);
    applyTheme(getTheme());
    applyRail();
    ensureDefs();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(getTheme()));
    try {
      useSnap(await WL.api.load());
    } catch (e) {
      document.getElementById("app").innerHTML = String(html`<div class="loading"><div class="empty"><strong>无法加载数据</strong><span>本地服务未运行，且找不到 data/demo.json。运行 uv run wardlab serve 后刷新。</span></div></div>`);
      return;
    }
    shell();
    render(false);
    window.addEventListener("hashchange", () => render(false));
    // 没有手动选过时，侧栏随窗口宽度展开或收起
    WIDE.addEventListener("change", () => { if (!railPref()) { applyRail(); rebuild(); } });
    document.addEventListener("click", onClick);
    document.addEventListener("change", (e) => {
      const t = e.target.closest('input[type="checkbox"][data-action]');
      if (t) onClick({ target: t, preventDefault() {} });
    });
    // 公共看板：每 5 分钟到站点取一次最新快照。有新版本才重绘（保留阅读位置）；没有就只更新页首横条，开着不关时也能显示“数据未更新”。
    // 从后台切回前台时，距上次检查超过 1 分钟就立即再查一次
    if (isPublic()) {
      const tick = async () => { if (await refreshPublished()) rebuild(); else updateStrip(); };
      setInterval(() => { if (!document.hidden) tick(); }, 300000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - pubCheck.at > 60000) tick(); });
    }
    // 实时模式：每 60 秒静默刷新快照，保留当前页面状态
    if (WL.api.source === "api") {
      setInterval(async () => {
        if (document.hidden) return;
        try { useSnap(await WL.api.load()); render(true); } catch (e) { /* 下次再试 */ }
      }, 60000);
    }
  }

  WL.views = WL.views || {};
  async function reload() {
    useSnap(await WL.api.load());
    rebuild();
  }

  WL.app = { boot, render, reload };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window.WL = window.WL || {});

</script>
</body></html>
